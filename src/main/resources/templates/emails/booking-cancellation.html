<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; background-color: #f8fafc; padding: 20px;">
<div style="max-width: 500px; background: white; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; margin: 0 auto;">
    <h2 style="color: #0f172a;">Salut, <span th:text="${userName}"></span>. </h2>
    <p style="color: #475569;">Te anunțăm că rezervarea ta pentru data de <strong><span th:text="${startDate}"></span></strong> (<span th:text="${location}"></span>) a fost anulată cu succes.</p>
    <p style="color: #475569;">Dacă dorești, poți face o nouă rezervare direct din aplicație.</p>
</div>
</body>
</html>
