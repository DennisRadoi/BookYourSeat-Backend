<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; background:#f8fafc; padding:20px;">
<div style="max-width:500px; background:#fff; padding:24px; border-radius:8px; border:1px solid #e2e8f0; margin:0 auto;">
  <h2 style="color:#0f172a;">Salut, <span th:text="${userName}"></span>!</h2>
  <p style="color:#475569;">Seria ta de rezervări a fost confirmată pentru <strong th:text="${location}"></strong>.</p>
  <p style="color:#475569;"><strong>Interval:</strong> <span th:text="${startTime}"></span>–<span th:text="${endTime}"></span></p>
  <p style="color:#475569;">Date rezervate:</p>
  <ul style="color:#334155; background:#f1f5f9; padding:16px 16px 16px 32px; border-radius:6px;">
    <li th:each="date : ${dates}" th:text="${date}" style="margin-bottom:6px;"></li>
  </ul>
</div>
</body>
</html>
