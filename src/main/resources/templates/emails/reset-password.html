<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resetare Parolă</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
<h2>Salut, <span th:text="${firstName}">Utilizator</span>!</h2>
<p>Ai solicitat resetarea parolei pentru contul tău.</p>
<p>Apasă pe butonul de mai jos pentru a-ți seta o parolă nouă. Link-ul este valabil timp de 15 minute:</p>
<p style="margin: 20px 0;">
    <a th:href="${resetLink}"
       style="background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
        Resetează Parola
    </a>
</p>
<p>Dacă nu ai solicitat tu această schimbare, poți ignora acest mesaj.</p>
</body>
</html>
