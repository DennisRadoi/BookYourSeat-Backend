<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; background-color: #f8fafc; padding: 20px;">
<div style="max-width: 500px; background: white; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; margin: 0 auto;">
    <h2 style="color: #0f172a;">Salut, <span th:text="${userName}"></span>! </h2>
    <p style="color: #475569;">Rezervarea ta la birou pentru <strong><span th:text="${location}"></span></strong> începe în 30 de minute (ora <span th:text="${startTime}"></span>).</p>
    <p style="color: #475569;">Este momentul să te pregătești pentru a ajunge la timp!</p>
</div>
</body>
</html>
