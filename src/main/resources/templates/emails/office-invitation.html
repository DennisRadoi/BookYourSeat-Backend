<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; background-color: #f8fafc; padding: 20px;">
<div style="max-width: 500px; background: white; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; margin: 0 auto;">
    <h2 style="color: #0f172a;">Salut, <span th:text="${addresseeName}"></span>! </h2>
    <p style="color: #475569;">Colegul tău, <strong><span th:text="${senderName}"></span></strong>, te-a invitat să vii la birou pe data de <strong><span th:text="${proposedDate}"></span></strong>.</p>

    <div style="background-color: #f1f5f9; padding: 16px; border-left: 4px solid #3b82f6; border-radius: 4px; margin: 16px 0;">
        <p style="color: #334155; margin: 0; font-style: italic;">"<span th:text="${message}"></span>"</p>
    </div>

    <p style="color: #475569;">Intră în aplicație pentru a accepta sau refuza invitația!</p>
</div>
</body>
</html>
