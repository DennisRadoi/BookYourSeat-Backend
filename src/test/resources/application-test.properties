# ============================================================
# Configurare pentru teste automate - H2 in-memory
# ============================================================

# H2 in-memory database (nu e nevoie de PostgreSQL pornit)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT - secret de test (minim 32 caractere)
jwt.secret=test-secret-key-minimum-32-characters-long-ok
jwt.expiration=86400000

# Mail - dezactivat pentru teste (EmailService va fi mock-uit)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Cloudinary - valori dummy pentru teste
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

# Docker Compose dezactivat
spring.docker.compose.enabled=false

# Actuator
spring.actuator.enabled=false
